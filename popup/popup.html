<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<script src="../ui/theme.js"></script>
<title>斗內預算管家</title>
<link rel="stylesheet" href="../ui/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
      <h1>斗內預算</h1>
    </div>
    <label class="control sm month"><input type="month" id="month" aria-label="月份"></label>
    <button class="icon-btn sm theme-toggle" type="button" title="切換深淺色">
      <span class="to-dark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="sr-only">切換為深色</span></span>
      <span class="to-light"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="sr-only">切換為淺色</span></span>
    </button>
  </header>

  <section class="card hero" id="total" aria-live="polite"></section>

  <section class="card list">
    <div class="list-h"><h2>直播主</h2><span class="muted" id="streamerCount"></span></div>
    <ul class="streamers" id="streamers"></ul>
  </section>

  <details class="card fold" id="unmatchedBox">
    <summary><span>未對應的頻道</span><span class="count" id="unmatchedCount"></span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
    <ul class="unmatched" id="unmatched"></ul>
    <p class="hint">到「設定」把頻道名稱加進直播主的別名，或開啟自動對應，就會被計入。</p>
  </details>

  <details class="card fold">
    <summary><span>手動新增一筆</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
    <form id="manual">
      <label class="control sm"><select name="streamerId" id="manualStreamer" aria-label="直播主"></select></label>
      <label class="control sm"><select name="platform" id="manualPlatform" aria-label="平台"></select></label>
      <label class="control sm"><select name="kind" aria-label="類型">
        <option>抖內</option><option>購買會員</option><option>贈送會員</option>
        <option>鑽石</option><option>小奇點</option><option>其他</option>
      </select></label>
      <label class="control sm"><span class="pre">NT$</span><input name="amount" type="number" min="1" required aria-label="金額"></label>
      <label class="control sm wide"><input name="date" type="date" required aria-label="日期"></label>
      <button class="btn primary sm wide">新增</button>
    </form>
  </details>

  <footer class="foot">
    <button class="btn sm" id="openStats"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>每月圖表</button>
    <button class="btn sm" id="openOptions"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>設定</button>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
